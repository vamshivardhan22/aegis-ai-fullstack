[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "B008",
  "B905",
  "BLE001",
  "DTZ003",
  "E501",
  "I001",
  "RUF012",
  "RUF059",
  "RUF100",
  "S102",
  "FLY002",
  "UP035",
  "UP042",
  "UP045",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false
strict_optional = false
disable_error_code = [
  "abstract",
  "arg-type",
  "assignment",
  "attr-defined",
  "return-value",
  "type-var",
  "var-annotated",
]
