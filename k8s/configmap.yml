apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis-ai
data:
  AEGIS_ENV: production
  AEGIS_STORAGE_BACKEND: minio
  AEGIS_LLM_PROVIDER: openai
  AEGIS_LLM_MODEL: gpt-4o-mini
  AEGIS_EMBEDDING_PROVIDER: openai
  AEGIS_EMBEDDING_MODEL: text-embedding-3-small
  AEGIS_CORS_ORIGINS: https://your-domain.example
  AEGIS_CORS_ORIGIN_REGEX: ""
  AEGIS_MINIO_ENDPOINT: minio:9000
  AEGIS_MLFLOW_TRACKING_URI: http://mlflow:5000
  AEGIS_QDRANT_URL: http://qdrant:6333
  AEGIS_REDIS_URL: redis://redis:6379/0
