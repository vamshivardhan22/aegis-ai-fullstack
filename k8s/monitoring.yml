apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aegis-api
  namespace: aegis-ai
spec:
  selector:
    matchLabels:
      app: aegis-api
  endpoints:
    - port: http
      path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: aegis-ai
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
