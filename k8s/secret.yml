apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis-ai
type: Opaque
stringData:
  AEGIS_SECRET_KEY: change-me-with-kubectl-create-secret
  AEGIS_DB_URL: postgresql+asyncpg://aegis:aegis_secret@postgres:5432/aegis
  AEGIS_MINIO_ACCESS_KEY: minioadmin
  AEGIS_MINIO_SECRET_KEY: minioadmin
---
# Production instruction:
# kubectl create secret generic aegis-secrets --from-env-file=.env -n aegis-ai --dry-run=client -o yaml | kubectl apply -f -
