apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis-ai
type: Opaque
stringData:
  AEGIS_SECRET_KEY: REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_CHARACTERS
  AEGIS_DB_URL: REPLACE_WITH_PRODUCTION_POSTGRESQL_URL
  AEGIS_MINIO_ACCESS_KEY: REPLACE_WITH_MINIO_ACCESS_KEY
  AEGIS_MINIO_SECRET_KEY: REPLACE_WITH_MINIO_SECRET_KEY
  AEGIS_OPENAI_API_KEY: REPLACE_WITH_OPENAI_API_KEY
  AEGIS_ANTHROPIC_API_KEY: REPLACE_WITH_ANTHROPIC_API_KEY
  AEGIS_GOOGLE_API_KEY: REPLACE_WITH_GOOGLE_API_KEY
---
# Production instruction:
# kubectl create secret generic aegis-secrets --from-env-file=.env -n aegis-ai --dry-run=client -o yaml | kubectl apply -f -
