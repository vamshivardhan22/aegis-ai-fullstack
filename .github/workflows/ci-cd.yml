name: Aegis AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  AEGIS_SECRET_KEY: "ci-secret-key"
  AEGIS_DB_URL: "sqlite+aiosqlite:///./aegis-ci.db"
  AEGIS_LOCAL_STORAGE_PATH: "./data"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m ruff check src --no-cache
      - run: python -m mypy src --no-error-summary

  unit-test:
    name: Backend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/verify_m5.py

  integration-test:
    name: API integration smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/e2e -q

  build:
    name: Build backend image and frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
        working-directory: aegis-frontend
      - run: pnpm run build
        working-directory: aegis-frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aegis-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Staging deployment dry run
    if: github.event_name == 'push'
    needs: [lint, unit-test, integration-test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f docker-compose.yml
      - run: test -f k8s/kustomization.yml
      - run: echo "Deployment manifests validated for staging handoff."

  e2e-test:
    name: Final E2E gate
    if: github.event_name == 'push'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/e2e -q
